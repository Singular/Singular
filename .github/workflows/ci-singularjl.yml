name: CI with Singular.jl

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - 'master'
      - 'spielwiese'

concurrency:
  # group by workflow and ref; the last slightly strange component ensures that for pull
  # requests, we limit to 1 concurrent job, but for the default repository branch we don't
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref_name != github.event.repository.default_branch || github.run_number }}
  # Cancel intermediate builds, but only if it is a pull request build.
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: Julia ${{ matrix.julia-version }} - Singular.jl ${{ matrix.singularjl-version }} - ${{ matrix.os }}${{ matrix.omalloc-config != 'default' && format(' - {0}', matrix.omalloc-config) || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    continue-on-error: ${{ matrix.julia-version == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        singularjl-version:
          - 'latest-release'
          - 'master'
        julia-version:
          - '1.10'
          - '1'         # latest stable release
          - 'nightly'
        os:
          - ubuntu-latest
        omalloc-config:
          - 'default'
        include:
          # Match the current macOS ARM JLL ABI for release and master.
          - singularjl-version: 'latest-release'
            julia-version: '1'
            os: macOS-latest
            omalloc-config: 'jll-4k'
          - singularjl-version: 'master'
            julia-version: '1'
            os: macOS-latest
            omalloc-config: 'jll-4k'
          # Also exercise a fully native macOS ARM stack.
          - singularjl-version: 'master'
            julia-version: '1'
            os: macOS-latest
            omalloc-config: 'native-16k'

    steps:
      - name: Checkout Singular
        uses: actions/checkout@v6
        with:
          path: 'SINGULARROOT'
      - name: "Set up Julia"
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - name: Install Singular.jl
        shell: julia --color=yes {0}
        run: |
          using Pkg
          if "${{ matrix.singularjl-version }}" == "latest-release"
            Pkg.add("Singular")
          else
            Pkg.add(; name="Singular", rev="${{ matrix.singularjl-version }}")
          end
          path = dirname(dirname(Base.find_package("Singular")))
          open(ENV["GITHUB_ENV"], "a") do io
              println(io, "SINGULARJL_PATH=$path")
          end
      - name: "Install dependencies (for macOS)"
        if: runner.os == 'macOS'
        run: |
          brew install autoconf automake libtool
      - name: "Select omalloc page size"
        if: matrix.omalloc-config != 'default'
        run: |
          if [[ "${{ matrix.omalloc-config }}" == "jll-4k" ]]; then
            echo "ac_cv_pagesize=4096" >> "$GITHUB_ENV"
          else
            if [[ "$(getconf PAGESIZE)" != "16384" ]]; then
              echo "native-16k requires a host with 16 KiB pages" >&2
              exit 1
            fi
            echo "ac_cv_pagesize=16384" >> "$GITHUB_ENV"
          fi
      - name: "Run autogen.sh in SINGULARROOT"
        run: |
          mv SINGULARROOT /tmp/SINGULARROOT
          cd /tmp/SINGULARROOT
          ./autogen.sh
      - name: "Override bundled Singular"
        run: |
          julia --proj=override $SINGULARJL_PATH/etc/setup_override_dir.jl /tmp/SINGULARROOT /tmp/singular_jll_override
      - name: "Verify omalloc page size"
        if: matrix.omalloc-config != 'default'
        run: |
          if [[ "${{ matrix.omalloc-config }}" == "jll-4k" ]]; then
            expected=4096
          else
            expected=16384
          fi
          grep -F "#define SIZEOF_SYSTEM_PAGE $expected" /tmp/singular_jll_override/include/omalloc/omConfig.h
      - name: "Run tests"
        env:
          # Singular.jl releases before its override cache-invalidation fix need
          # a fresh package-image configuration for a native 16 KiB override.
          OVERRIDE_JULIA_ARGS: ${{ matrix.omalloc-config == 'native-16k' && '--check-bounds=yes' || '' }}
        run: |
          julia --proj=override $SINGULARJL_PATH/etc/run_with_override.jl /tmp/singular_jll_override $OVERRIDE_JULIA_ARGS --depwarn=error -e "using Pkg; Pkg.test(\"Singular\")"
