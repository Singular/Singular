name: Run tests with SpaSM

on:
  pull_request:

permissions:
  contents: read

env:
  prefix: "/tmp/prefix"

jobs:
  test:
    name: SpaSM (${{ matrix.os }}, ${{ matrix.variant }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            variant: default
            configflags: ""
          - os: ubuntu-latest
            variant: ntl-flint
            configflags: "--with-ntl --with-flint"
          - os: macos-latest
            variant: default
            configflags: ""
          - os: macos-latest
            variant: ntl-flint
            configflags: "--with-ntl --with-flint"
          - os: macos-15
            variant: ntl-flint
            configflags: "--with-ntl --with-flint"
          - os: macos-15-intel
            variant: ntl-flint
            configflags: "--with-ntl --with-flint"
          - os: macos-26
            variant: ntl-flint
            configflags: "--with-ntl --with-flint"

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Show runner info
        run: |
          uname -a
          echo "uname -m=$(uname -m)"
          if command -v getconf >/dev/null 2>&1; then
            echo "getconf PAGESIZE=$(getconf PAGESIZE)"
          fi

      - name: Install dependencies
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get update
            # sharutils is for uudecode
            sudo apt-get install -y \
              sharutils libgmp-dev libreadline-dev libmpfr-dev libntl-dev libcdd-dev \
              4ti2 normaliz libopenblas-dev libflint-dev \
              cmake
          elif [ "$RUNNER_OS" == "macOS" ]; then
            brew install autoconf automake libtool cmake pkg-config gmp readline mpfr ntl cddlib flint
            # TODO: 4ti2?
            # TODO: normaliz?
          else
            echo "$RUNNER_OS not supported"
            exit 1
          fi

      - name: Install SpaSM dependencies
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get install -y fflas-ffpack pkg-config
          else
            brew tap Macaulay2/tap
            brew trust --tap Macaulay2/tap
            brew install Macaulay2/tap/fflas-ffpack
          fi

      - name: Check out SpaSM
        uses: actions/checkout@v5
        with:
          repository: cbouilla/spasm
          ref: 09c40943f1d4b754f89fb97fc9ddf2b8e53e967e
          path: .ci/spasm
          persist-credentials: false

      - name: Build SpaSM
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          cmake_args=(-DBUILD_TESTING=OFF)
          if [ "$RUNNER_OS" == "macOS" ]; then
            omp_prefix=$(brew --prefix libomp)
            fflas_prefix=$(brew --prefix Macaulay2/tap/fflas-ffpack)
            givaro_prefix=$(brew --prefix Macaulay2/tap/givaro)
            pc_overlay="$GITHUB_WORKSPACE/.ci/pkgconfig"
            mkdir -p "$pc_overlay"
            sed -e "/^Cflags:/s# -L$omp_prefix/lib##g" -e '/^Cflags:/s# -lomp##g' \
              "$fflas_prefix/lib/pkgconfig/fflas-ffpack.pc" > "$pc_overlay/fflas-ffpack.pc"
            export PKG_CONFIG_PATH="$pc_overlay:$fflas_prefix/lib/pkgconfig:$givaro_prefix/lib/pkgconfig:$(brew --prefix gmp)/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
            cmake_args+=(
              "-DCMAKE_PREFIX_PATH=$omp_prefix;$fflas_prefix;$givaro_prefix"
              "-DOpenMP_C_FLAGS=-Xpreprocessor -fopenmp -I$omp_prefix/include"
              "-DOpenMP_C_LIB_NAMES=omp"
              "-DOpenMP_CXX_FLAGS=-Xpreprocessor -fopenmp -I$omp_prefix/include"
              "-DOpenMP_CXX_LIB_NAMES=omp"
              "-DOpenMP_omp_LIBRARY=$omp_prefix/lib/libomp.dylib"
              "-DCMAKE_SHARED_LINKER_FLAGS=-framework Accelerate"
            )
            if [ "$RUNNER_ARCH" == "X64" ]; then
              cmake_args+=(
                "-DCMAKE_CXX_FLAGS=-Wno-error=deprecated-copy-with-user-provided-copy -Wno-error=sign-compare -Wno-error=unused-but-set-variable -Wno-error=unused-parameter -Wno-error=unused-variable"
              )
            fi
          elif [ "$RUNNER_OS" == "Linux" ]; then
            cmake_args+=("-DCMAKE_C_FLAGS=-Wno-error=format-truncation -Wno-error=unused-result")
          fi
          pkg-config --exists givaro fflas-ffpack
          cmake -S .ci/spasm -B .ci/spasm/build "${cmake_args[@]}"
          cmake --build .ci/spasm/build --target spasm --parallel 3
          if [ "$RUNNER_OS" == "macOS" ]; then
            test -f .ci/spasm/build/src/libspasm.dylib
          else
            test -f .ci/spasm/build/src/libspasm.so
          fi
          echo "CPPFLAGS=-I$GITHUB_WORKSPACE/.ci/spasm/src" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$GITHUB_WORKSPACE/.ci/spasm/build/src -Wl,-rpath,$GITHUB_WORKSPACE/.ci/spasm/build/src" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/.ci/spasm/build/src${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$GITHUB_WORKSPACE/.ci/spasm/build/src${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - run: ./autogen.sh
      - run: ./configure --prefix=$prefix --enable-gfanlib ${{ matrix.configflags }}
      - name: Require SpaSM
        run: |
          grep -q '^#define HAVE_SPASM_H 1$' _config.h
          grep -q '^#define HAVE_SPASM 1$' _config.h
      - run: make -j3
      - run: make check
      - run: make install

      - run: cd Tst && ./regress.cmd -s $prefix/bin/Singular Old/universal.lst
        if: ${{ always() }}
      #- run: cd Tst && ./regress.cmd -s $prefix/bin/Singular Buch/buch.lst
      #  if: ${{ always() }}
      - run: cd Tst && ./regress.cmd -s $prefix/bin/Singular Plural/short.lst
        if: ${{ always() }}
      - run: cd Tst && ./regress.cmd -s $prefix/bin/Singular Plural/dmod.lst
        if: ${{ always() }}
      - run: cd Tst && ./regress.cmd -s $prefix/bin/Singular Manual/annRat.tst Manual/deRhamCohom.tst Manual/deRhamCohomIdeal.tst
        if: ${{ always() }}
      - run: cd Tst && ./regress.cmd -s $prefix/bin/Singular Short/ok_s.lst
        if: ${{ always() }}

      - name: Run Tst/New/new.tst (if present)
        if: ${{ always() && runner.os == 'Linux' && matrix.configflags == '--with-ntl --with-flint' && hashFiles('Tst/New/new.tst') != '' }}
        run: cd Tst && ./regress.cmd -s $prefix/bin/Singular New/new.tst

      - name: Run Tst/New.lst (filtered)
        if: ${{ always() && runner.os == 'Linux' && matrix.configflags == '--with-ntl --with-flint' }}
        run: |
          cd Tst
          grep -v -E '^New/(dim_integers|qring_ZmtoZmn|qring_ZmtoZmn_errorCoprime|qring_ZtoZm|qring_ntom|qring_with_constant|ringlocal)\.tst$' \
            New.lst > New.ci.lst
          ./regress.cmd -s $prefix/bin/Singular New.ci.lst
