name: Release Tarball

## Build a distribution tarball (with autotools-generated files and optional
## old documentation) and attach it to the GitHub Release.
##
## The tarball reproduces the layout of the tarballs historically published
## at https://www.singular.uni-kl.de/ftp/pub/Math/Singular/src/ and used
## by SageMath.
##
## Trigger: publishing a GitHub Release whose tag looks like
##   Release-4-4-1p5 or v4.4.1p5   – patch release
##   Release-4-5-0   or v4.5.0     – major release

on:
  release:
    types: [published]
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: What to build
        required: true
        default: tarball
        type: choice
        options:
          - tarball
          - old-docu
          - tarball-with-old-docu
      tarball_version:
        description: >
          Override tarball version string (e.g. 4.4.1p6).
          Leave empty to derive from the release tag.
        required: false
      distribution_build:
        description: Build a manual non-dev distribution test tarball
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tarball:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────
      - name: Check out source
        uses: actions/checkout@v4
        with:
          # full history so that `git archive` works
          fetch-depth: 0

      # ── 2. Determine version strings and selected mode ───────────
      - name: Compute build settings
        id: settings
        env:
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_TARBALL_VERSION: ${{ inputs.tarball_version }}
          INPUT_DISTRIBUTION_BUILD: ${{ inputs.distribution_build }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          MODE="${INPUT_MODE:-tarball}"
          DISTRIBUTION_BUILD="${INPUT_DISTRIBUTION_BUILD:-false}"
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            MODE="tarball"
          fi

          case "$MODE" in
            tarball|old-docu|tarball-with-old-docu) ;;
            *)
              echo "::error::Unknown mode: $MODE"
              exit 1
              ;;
          esac

          case "$DISTRIBUTION_BUILD" in
            true|false) ;;
            *)
              echo "::error::distribution_build must be true or false"
              exit 1
              ;;
          esac

          # Prefer the manual input, then the release tag, then configure.ac
          SOURCE_VERSION="$(sed -n "s/^AC_INIT(\[singular\], \[\(.*\)\],.*/\1/p" configure.ac)"
          if [[ -z "$SOURCE_VERSION" ]]; then
            echo "::error::Could not read Singular version from configure.ac"
            exit 1
          fi

          release_version_key() {
            local release_version="$1"
            if [[ "$release_version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(p([0-9]+))?$ ]]; then
              local patchlevel=0
              if [[ -n "${BASH_REMATCH[5]:-}" ]]; then
                patchlevel="${BASH_REMATCH[5]}"
              fi
              printf "%05d.%05d.%05d.%05d\n" \
                "${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}" \
                "${BASH_REMATCH[3]}" "$patchlevel"
            else
              return 1
            fi
          }

          release_tag_version() {
            local release_tag="$1"
            if [[ "$release_tag" =~ ^Release-([0-9]+)-([0-9]+)-([0-9]+)(p[0-9]+)?$ ]]; then
              printf "%s.%s.%s%s\n" \
                "${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}" \
                "${BASH_REMATCH[3]}" "${BASH_REMATCH[4]}"
            elif [[ "$release_tag" =~ ^v?([0-9]+)\.([0-9]+)\.([0-9]+)(p[0-9]+)?$ ]]; then
              printf "%s.%s.%s%s\n" \
                "${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}" \
                "${BASH_REMATCH[3]}" "${BASH_REMATCH[4]}"
            else
              return 1
            fi
          }

          MANUAL_DISTRIBUTION_TEST=false
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$DISTRIBUTION_BUILD" == "true" ]]; then
            MANUAL_DISTRIBUTION_TEST=true
            if [[ -z "$INPUT_TARBALL_VERSION" ]]; then
              echo "::error::Manual distribution test builds require tarball_version"
              exit 1
            fi
          fi

          if [[ -n "$INPUT_TARBALL_VERSION" ]]; then
            TARVERSION="$INPUT_TARBALL_VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if ! TARVERSION="$(release_tag_version "$GITHUB_REF_NAME")"; then
              echo "::error::Release tag must look like X.Y.Z, X.Y.ZpN, vX.Y.Z, vX.Y.ZpN, Release-X-Y-Z, or Release-X-Y-ZpN: $GITHUB_REF_NAME"
              exit 1
            fi
          else
            TARVERSION="${SOURCE_VERSION}-dev"
          fi

          # Base VERSION is everything up to the first 'p' suffix
          #   4.4.1p5 → 4.4.1    4.4.1 → 4.4.1
          VERSION="${TARVERSION%%p*}"
          BUILD_DOCS=false
          BUILD_TARBALL=false
          INCLUDE_DOCS=false
          MAKE_DISTRIBUTION=false

          if [[ "$GITHUB_EVENT_NAME" == "release" || "$MANUAL_DISTRIBUTION_TEST" == "true" ]]; then
            if [[ "$VERSION" != "$SOURCE_VERSION" ]]; then
              echo "::error::Release version $VERSION does not match configure.ac version $SOURCE_VERSION"
              exit 1
            fi

            if ! current_release_key="$(release_version_key "$TARVERSION")"; then
              echo "::error::Release tag version must be X.Y.Z or X.Y.ZpN: $TARVERSION"
              exit 1
            fi

            previous_release_version=""
            previous_release_key=""
            while IFS= read -r release_tag; do
              if [[ "$release_tag" == "$GITHUB_REF_NAME" ]]; then
                continue
              fi
              if ! release_tag_name_version="$(release_tag_version "$release_tag")"; then
                continue
              fi
              if ! release_tag_key="$(release_version_key "$release_tag_name_version")"; then
                continue
              fi
              if [[ -z "$previous_release_key" || "$release_tag_key" > "$previous_release_key" ]]; then
                previous_release_version="$release_tag_name_version"
                previous_release_key="$release_tag_key"
              fi
            done < <(gh api --paginate "/repos/${GITHUB_REPOSITORY}/releases" --jq '.[] | select(.draft == false) | .tag_name')

            if [[ -z "$previous_release_key" ]]; then
              echo "::error::Could not find a previous release tag to verify that $TARVERSION is bumped"
              exit 1
            fi

            if [[ ! "$current_release_key" > "$previous_release_key" ]]; then
              echo "::error::Release version $TARVERSION is not newer than previous release $previous_release_version"
              exit 1
            fi

            MAKE_DISTRIBUTION=true
          fi

          TARBALL_BASENAME="singular-${TARVERSION}"
          ARTIFACT_NAME="singular-tarball"
          if [[ "$MANUAL_DISTRIBUTION_TEST" == "true" ]]; then
            TARBALL_BASENAME="singular-${TARVERSION}-distribution-test"
            ARTIFACT_NAME="singular-distribution-test-tarball"
          fi

          if [[ "$MODE" == "old-docu" || "$MODE" == "tarball-with-old-docu" ]]; then
            BUILD_DOCS=true
          fi

          if [[ "$MODE" == "tarball" || "$MODE" == "tarball-with-old-docu" ]]; then
            BUILD_TARBALL=true
          fi

          if [[ "$MODE" == "tarball-with-old-docu" ]]; then
            INCLUDE_DOCS=true
          fi

          if [[ "$BUILD_TARBALL" == "true" && ! "$TARVERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(p[0-9]+|-dev)?$ ]]; then
            echo "::error::Invalid tarball version: $TARVERSION"
            exit 1
          fi

          echo "MODE=$MODE" >> "$GITHUB_OUTPUT"
          echo "TARVERSION=$TARVERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "BUILD_DOCS=$BUILD_DOCS" >> "$GITHUB_OUTPUT"
          echo "BUILD_TARBALL=$BUILD_TARBALL" >> "$GITHUB_OUTPUT"
          echo "INCLUDE_DOCS=$INCLUDE_DOCS" >> "$GITHUB_OUTPUT"
          echo "MAKE_DISTRIBUTION=$MAKE_DISTRIBUTION" >> "$GITHUB_OUTPUT"
          echo "TARBALL_BASENAME=$TARBALL_BASENAME" >> "$GITHUB_OUTPUT"
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

      # ── 2b. Select dev/release banner mode ───────────────────────
      # Keep normal checkout builds unchanged.  Only this workflow edits the
      # marker for a published GitHub Release.
      - name: Set distribution marker
        env:
          MAKE_DISTRIBUTION: ${{ steps.settings.outputs.MAKE_DISTRIBUTION }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$MAKE_DISTRIBUTION" == "true" ]]; then
            printf '#define MAKE_DISTRIBUTION\n' > libpolys/misc/distrib.h
          else
            printf '#undef MAKE_DISTRIBUTION\n' > libpolys/misc/distrib.h
          fi

      # ── 3. Install build prerequisites ────────────────────────────
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake libtool libgmp-dev libmpfr-dev libreadline-dev \
            libcdd-dev libntl-dev libflint-dev libopenblas-dev \
            4ti2 normaliz cmake texinfo perl

      # ── 4. Install old documentation prerequisites ────────────────
      - name: Install old docu dependencies
        if: steps.settings.outputs.BUILD_DOCS == 'true'
        run: |
          sudo apt-get install -y \
            texlive texlive-latex-extra texlive-plain-generic \
            latex2html sharutils

      # ── 5. Build Singular ────────────────────────────────────────
      - name: autogen + configure + build
        env:
          BUILD_DOCS: ${{ steps.settings.outputs.BUILD_DOCS }}
        shell: bash
        run: |
          set -euo pipefail
          ./autogen.sh

          configure_flags=(
            --enable-gfanlib
            --with-ntl
            --with-flint
          )

          if [[ "$BUILD_DOCS" == "true" ]]; then
            configure_flags+=(--enable-doc-build)
          fi

          ./configure "${configure_flags[@]}"
          if [[ "$BUILD_DOCS" == "true" ]]; then
            exclusions="$(.github/scripts/build-old-documentation.sh \
              --print-exclusions)"
            make -j"$(nproc)" \
              DOC2TEX_EXAMPLE_EXCLUSIONS="$exclusions"
          else
            make -j"$(nproc)"
          fi

      # ── 6. Build old documentation (doc.tbz2) ────────────────────
      - name: Build old docu
        if: steps.settings.outputs.BUILD_DOCS == 'true'
        shell: bash
        run: |
          .github/scripts/build-old-documentation.sh --build

      - name: Record old docu source
        if: steps.settings.outputs.BUILD_DOCS == 'true'
        shell: bash
        run: |
          set -euo pipefail
          source_version="$(sed -n \
            's/^AC_INIT(\[singular\], \[\([^]]*\)\],.*/\1/p' configure.ac)"
          test -n "$source_version"
          test -s doc/doc.tbz2
          {
            echo "repository=$GITHUB_REPOSITORY"
            echo "commit=$(git rev-parse HEAD)"
            echo "version=$source_version"
            echo "workflow_run_id=$GITHUB_RUN_ID"
          } > doc/documentation-source.txt

      # ── 7. Upload old documentation artifact ─────────────────────
      - name: Upload old docu artifact
        if: steps.settings.outputs.BUILD_DOCS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: singular-old-docu
          path: |
            doc/doc.tbz2
            doc/documentation-source.txt
            doc/singular.info
            doc/singular.idx
            doc/html

      - name: Show old docu reuse instructions
        if: steps.settings.outputs.BUILD_DOCS == 'true'
        shell: bash
        run: |
          {
            echo "## Legacy documentation"
            echo
            echo "Use workflow run ID \`$GITHUB_RUN_ID\` in the Binary packages workflow."
          } >> "$GITHUB_STEP_SUMMARY"

      # ── 8. Generate spec file ─────────────────────────────────────
      # configure already expanded redhat/singular.spec from
      # redhat/singular.spec.in, so it is ready to copy.

      # ── 9. Generate all.lib ───────────────────────────────────────
      # `make` already built Singular/all.lib via the all-local target.

      # ── 10. Package the tarball (mirrors make_tar.sh) ─────────────
      - name: Create release tarball
        if: steps.settings.outputs.BUILD_TARBALL == 'true'
        env:
          INCLUDE_DOCS: ${{ steps.settings.outputs.INCLUDE_DOCS }}
          TARVERSION: ${{ steps.settings.outputs.TARVERSION }}
          VERSION: ${{ steps.settings.outputs.VERSION }}
          MAKE_DISTRIBUTION: ${{ steps.settings.outputs.MAKE_DISTRIBUTION }}
          TARBALL_BASENAME: ${{ steps.settings.outputs.TARBALL_BASENAME }}
        shell: bash
        run: |
          set -eo pipefail

          # --- sanity-check that required build artefacts exist ---
          required_files=(redhat/singular.spec Singular/all.lib)
          if [[ "$INCLUDE_DOCS" == "true" ]]; then
            required_files+=(doc/doc.tbz2)
          fi

          for f in "${required_files[@]}"; do
            if [[ ! -f "$f" ]]; then
              echo "::error::Required artefact missing: $f"
              exit 1
            fi
          done

          # --- export a clean tree from git ---
          rm -rf "singular-${VERSION}"
          git archive --prefix="singular-${VERSION}/" HEAD | tar xf -

          if [[ "$MAKE_DISTRIBUTION" == "true" ]]; then
            printf '#define MAKE_DISTRIBUTION\n' > "singular-${VERSION}/libpolys/misc/distrib.h"
          else
            printf '#undef MAKE_DISTRIBUTION\n' > "singular-${VERSION}/libpolys/misc/distrib.h"
          fi

          # --- remove files that should not ship ---
          # .gdbinit files
          find "singular-${VERSION}" -name .gdbinit -delete 2>/dev/null || true

          # IntegerProgramming/README conflicts with top-level README
          rm -f "singular-${VERSION}/IntegerProgramming/README"

          # copy compiled old documentation, if requested
          if [[ "$INCLUDE_DOCS" == "true" ]]; then
            cp doc/doc.tbz2 "singular-${VERSION}/doc/"
          fi

          # run autogen.sh inside the exported tree to generate
          # configure, Makefile.in, aclocal.m4, etc.
          (cd "singular-${VERSION}" && ./autogen.sh)

          # remove autom4te caches
          find "singular-${VERSION}" -type d -name autom4te.cache -exec rm -rf {} + 2>/dev/null || true

          # remove misc unneeded dirs/files
          rm -rf "singular-${VERSION}/omalloc/Misc"
          rm -rf "singular-${VERSION}/Singular/LIB/surfex"
          rm -f  "singular-${VERSION}/Singular/cnf2ideal.py"
          rm -rf "singular-${VERSION}/kernel/old" "singular-${VERSION}/kernel/sample"
          rm -f  "singular-${VERSION}/dox/Doxyfile.html.all" \
                 "singular-${VERSION}/dox/Doxyfile.in1" \
                 "singular-${VERSION}/dox/Doxyfile.latex.short" \
                 "singular-${VERSION}/dox/readme"
          rm -f  "singular-${VERSION}/factory/ConwayList.txt"
          rm -rf "singular-${VERSION}/logo" \
                 "singular-${VERSION}/standalone.test" \
                 "singular-${VERSION}/templates" \
                 "singular-${VERSION}/tests"

          # remove .git metadata files
          find "singular-${VERSION}" -name '.git*' -delete 2>/dev/null || true

          # copy generated artefacts produced by the build
          cp redhat/singular.spec "singular-${VERSION}/redhat/singular.spec"
          cp Singular/all.lib     "singular-${VERSION}/Singular/LIB/"

          # --- verify the exported tree has key files ---
          expected_files=(
            "singular-${VERSION}/configure"
            "singular-${VERSION}/Singular/LIB/all.lib"
            "singular-${VERSION}/redhat/singular.spec"
          )

          if [[ "$INCLUDE_DOCS" == "true" ]]; then
            expected_files+=("singular-${VERSION}/doc/doc.tbz2")
          fi

          for f in "${expected_files[@]}"; do
            if [[ ! -f "$f" ]]; then
              echo "::error::Expected file missing from tarball tree: $f"
              exit 1
            fi
          done

          # --- create the compressed tarball ---
          tar cf "${TARBALL_BASENAME}.tar" "singular-${VERSION}"
          gzip -9 -f "${TARBALL_BASENAME}.tar"
          ls -lh "${TARBALL_BASENAME}.tar.gz"

          # clean up
          rm -rf "singular-${VERSION}"

      # ── 11. Upload tarball as workflow artifact ───────────────────
      - name: Upload tarball artifact
        if: steps.settings.outputs.BUILD_TARBALL == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.settings.outputs.ARTIFACT_NAME }}
          path: ${{ steps.settings.outputs.TARBALL_BASENAME }}.tar.gz

      # ── 12. Attach tarball to GitHub Release ─────────────────────
      - name: Attach tarball to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.settings.outputs.TARBALL_BASENAME }}.tar.gz
