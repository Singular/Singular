name: Run tests

# Trigger the workflow on push or pull request
on: [push, pull_request]

env:
  prefix: "/tmp/prefix"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        configflags: ["", "--with-ntl --with-flint", "--without-ntl --with-flint"]
        include:
          - os: macos-15
            configflags: "--with-ntl --with-flint"
          - os: macos-26
            configflags: "--with-ntl --with-flint"

    steps:
      - uses: actions/checkout@v5

      - name: Show runner info
        run: |
          uname -a
          echo "uname -m=$(uname -m)"
          if command -v getconf >/dev/null 2>&1; then
            echo "getconf PAGESIZE=$(getconf PAGESIZE)"
          fi

      - name: Install dependencies
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get update
            # sharutils is for uudecode
            sudo apt-get install -y \
              sharutils libgmp-dev libreadline-dev libmpfr-dev libntl-dev libcdd-dev \
              4ti2 normaliz libopenblas-dev libflint-dev \
              cmake
          elif [ "$RUNNER_OS" == "macOS" ]; then
            brew install autoconf automake libtool gmp readline mpfr ntl cddlib flint
            # TODO: 4ti2?
            # TODO: normaliz?
          else
            echo "$RUNNER_OS not supported"
            exit 1
          fi

      - run: ./autogen.sh
      - run: ./configure --prefix=$prefix --enable-gfanlib ${{ matrix.configflags }}
      - run: make -j3
      - run: make check
      - run: make install

      - run: cd Tst && ./regress.cmd -s $prefix/bin/Singular Old/universal.lst
        if: ${{ always() }}
      #- run: cd Tst && ./regress.cmd -s $prefix/bin/Singular Buch/buch.lst
      #  if: ${{ always() }}
      - run: cd Tst && ./regress.cmd -s $prefix/bin/Singular Plural/short.lst
        if: ${{ always() }}
      - run: cd Tst && ./regress.cmd -s $prefix/bin/Singular Plural/dmod.lst
        if: ${{ always() }}
      - run: cd Tst && ./regress.cmd -s $prefix/bin/Singular Manual/annRat.tst Manual/deRhamCohom.tst Manual/deRhamCohomIdeal.tst
        if: ${{ always() }}
      - run: cd Tst && ./regress.cmd -s $prefix/bin/Singular Short/ok_s.lst
        if: ${{ always() }}

      - name: Run Tst/New/new.tst (if present)
        if: ${{ always() && runner.os == 'Linux' && matrix.configflags == '--with-ntl --with-flint' && hashFiles('Tst/New/new.tst') != '' }}
        run: cd Tst && ./regress.cmd -s $prefix/bin/Singular New/new.tst

      - name: Run Tst/New.lst (filtered)
        if: ${{ always() && runner.os == 'Linux' && matrix.configflags == '--with-ntl --with-flint' }}
        run: |
          cd Tst
          grep -v -E '^New/(dim_integers|qring_ZmtoZmn|qring_ZmtoZmn_errorCoprime|qring_ZtoZm|qring_ntom|qring_with_constant|ringlocal)\.tst$' \
            New.lst > New.ci.lst
          ./regress.cmd -s $prefix/bin/Singular New.ci.lst

      #- run: cd Tst && ./regress.cmd -s $prefix/bin/Singular Long/ok_l.lst
      #  if: ${{ always() }}

  cygwin:
    name: Windows (Cygwin) - windows-latest
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CHERE_INVOKING: 1
      CYGWIN_NOWINPATH: 1

    steps:
      - name: Preserve Unix line endings
        run: git config --global core.autocrlf input

      - uses: actions/checkout@v5

      - name: Install Cygwin and build dependencies
        uses: cygwin/cygwin-install-action@v6
        with:
          packages: >-
            autoconf automake binutils cddlib-devel cygwin-devel gcc-core
            gcc-g++ git libflint-devel libgmp-devel libmpfr-devel
            libntl-devel libreadline-devel libtool m4 make perl pkg-config
            texinfo

      - name: Verify Cygwin system page size
        run: >-
          bash --login -eo pipefail -c
          'uname -a; page_size=$(getconf PAGESIZE);
          echo "getconf PAGESIZE=$page_size"; test "$page_size" = 65536'

      - name: Generate build system
        run: bash --login -eo pipefail -c './autogen.sh'

      - name: Configure
        run: >-
          bash --login -eo pipefail -c
          './configure --prefix=/tmp/prefix --disable-shared --enable-gfanlib
          --disable-p-procs-dynamic --enable-p-procs-static
          --with-builtinmodules=gfanlib,gitfan,interval,loctriv,partialgb,syzextra,customstd,cohomo,subsets,freealgebra,systhreads
          --without-python --without-pythonmodule --disable-cf-inline'

      - name: Build
        run: bash --login -eo pipefail -c 'make -j2'

      - name: Test omalloc
        run: bash --login -eo pipefail -c 'make -C omalloc check'

      - name: Install
        run: bash --login -eo pipefail -c 'make install'

      - name: Smoke-test Singular
        run: bash --login -eo pipefail -c '/tmp/prefix/bin/Singular --version'

  extra:

    runs-on: ubuntu-latest

    timeout-minutes: 120

    steps:

      - uses: actions/checkout@v5

      - name: Install dependencies

        run: |

          sudo apt-get update
          sudo apt-get install -y \
            sharutils libgmp-dev libreadline-dev libmpfr-dev libntl-dev libcdd-dev \
            4ti2 normaliz gfan libopenblas-dev libflint-dev \
            cmake

      - run: ./autogen.sh

      - run: ./configure --prefix=$prefix --enable-gfanlib --with-ntl --with-flint

      - run: make -j"$(nproc)"

      - run: make install

      - name: Build extra CI list

        run: |

          cat > Tst/Extra.ci.lst <<'EOF'
          Buch/Example_1_8_7.tst
          Short/bug_53.tst
          Short/bug_55.tst
          Short/bug_div.tst
          Short/rInit.tst
          Short/solve_s.tst
          Long/tropical.tst
          Manual/fglm_solve.tst
          Manual/laguerre_solve.tst
          Manual/lex_solve.tst
          Manual/number_pi.tst
          Manual/simplex.tst
          Manual/simplexOut.tst
          Manual/solve.tst
          Manual/triangL_solve.tst
          Manual/triangLf_solve.tst
          Manual/triangM_solve.tst
          Manual/triang_solve.tst
          EOF

      - name: Run extra regression tests

        run: cd Tst && ./regress.cmd -s $prefix/bin/Singular Extra.ci.lst

      - name: Upload regression artifacts

        if: ${{ failure() }}

        uses: actions/upload-artifact@v4

        with:

          name: singular-extra-regressions
          path: |
            Tst/**/*.diff
            Tst/**/*.stat.diff
            Tst/**/*.new.res
            Tst/**/*.new.stat
            Tst/Extra.ci.lst

